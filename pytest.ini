[pytest]
testpaths = tests
addopts = --import-mode=importlib
markers =
    unit: Teste Unitario - menor unidade testavel (banner/menu de cada modulo)
    component: Teste de Componente - modulo completo isolado via BANKMAIN
    integration_big_bang: Integracao Big Bang - varios modulos integrados em uma unica sessao
    integration_top_down: Integracao Top-down - fluxo do menu principal ate o modulo
    integration_bottom_up: Integracao Bottom-up - operacao do modulo integrando de volta ao menu principal
    integration_sandwich: Integracao Sanduiche/Hibrida - combinacao top-down e bottom-up
    system: Teste de Sistema - sessao completa ponta a ponta via BANKMAIN
    acceptance_uat: Aceitacao UAT - validacao do ponto de vista do usuario final
    acceptance_alpha: Aceitacao Alpha - testes internos de robustez (entradas invalidas)
    acceptance_beta: Aceitacao Beta - simulacao de uso externo realista
    acceptance_operational: Aceitacao Operacional - operabilidade e encerramento limpo do sistema
    acceptance_regulatory: Aceitacao Contratual/Regulatoria - requisitos regulatorios/contratuais
